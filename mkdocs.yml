site_name: Web 爬虫实战
site_description: 一本面向实践的 Web 爬虫教程
site_url: https://xuchongfeng.github.io/web_crawler_book/
repo_url: https://github.com/xuchongfeng/web_crawler_book
repo_name: xuchongfeng/web_crawler_book
edit_uri: ""

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切换至浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至跟随系统

markdown_extensions:
  - pymdownx.highlight:
      guess_lang: false
  - pymdownx.superfences

nav:
  - 首页: index.md
  - 前言: preface.md
  - 目录: outline.md
  - 第一部分 路线与精简基础:
    - 第 1 章 怎么读这本书: ch01-how-to-read.md
    - 第 2 章 爬虫难在哪里: ch02-why-hard.md
    - 第 3 章 精简基础: ch03-foundations.md
  - 第二部分 出口与风险:
    - 第 4 章 出口类型与任务匹配: ch04-egress.md
    - 第 5 章 代理池: ch05-proxy-pool.md
    - 第 6 章 验证码与挑战页: ch06-captcha.md
