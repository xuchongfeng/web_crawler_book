site_name: Web 爬虫实战
site_description: 一本面向实践的 Web 爬虫教程
site_url: https://xuchongfeng.github.io/web_crawler_book/
repo_url: https://github.com/xuchongfeng/web_crawler_book
repo_name: xuchongfeng/web_crawler_book
edit_uri: ""

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切换至浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至跟随系统

markdown_extensions:
  - pymdownx.highlight:
      guess_lang: false
  - pymdownx.superfences

nav:
  - 首页: index.md
  - 前言: preface.md
  - 目录: outline.md
  - 第一部分 路线与精简基础:
    - 第 1 章 怎么读这本书: ch01-how-to-read.md
    - 第 2 章 爬虫难在哪里: ch02-why-hard.md
    - 第 3 章 精简基础: ch03-foundations.md
  - 第二部分 出口与风险:
    - 第 4 章 出口类型与任务匹配: ch04-egress.md
    - 第 5 章 代理池: ch05-proxy-pool.md
    - 第 6 章 验证码与挑战页: ch06-captcha.md
  - 第三部分 账号与身份:
    - 第 7 章 授权账号工程: ch07-accounts.md
    - 第 8 章 账号滥用红线: ch08-abuse-lines.md
  - 第四部分 App 协议采集:
    - 第 9 章 App 流量与抓包: ch09-app-traffic.md
    - 第 10 章 协议、签名形态与增量: ch10-protocol.md
    - 第 11 章 客户端形态与 UI 触发: ch11-ui-trigger.md
  - 第五部分 客户端分析:
    - 第 12 章 源码与制品从哪来: ch12-artifacts.md
    - 第 13 章 静态工具链: ch13-static-tools.md
    - 第 14 章 加固认知与教学壳: ch14-hardening.md
    - 第 15 章 混淆与还原（自有包）: ch15-obfuscation.md
    - 第 16 章 Frida：授权调试器: ch16-frida.md
    - 第 17 章 JNI、so 与调起（自研 so）: ch17-jni-so.md
    - 第 18 章 分析结果回流采集系统: ch18-reflow.md
  - 第六部分 设备实验室:
    - 第 19 章 群控作为工程问题: ch19-device-farm.md
    - 第 20 章 云手机、混部与观测: ch20-cloud-phone.md
